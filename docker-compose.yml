services:
  postgres:
    image: postgres:17
    container_name: buildcost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildcost
      POSTGRES_USER: buildcost
      POSTGRES_PASSWORD: buildcost_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildcost -d buildcost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: